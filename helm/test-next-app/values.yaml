# Image for the Next.js app built with build/Dockerfile from the repo root.
image:
  repository: test-next-app
  tag: latest
  pullPolicy: IfNotPresent

# Native gRPC server reached by Envoy. In Kubernetes this is usually a Service
# DNS name, for example: control-panel-api.default.svc.cluster.local. The
# browser does not receive this value; Envoy/Gateway routing keeps it internal.
upstreamGrpc:
  host: control-panel-grpc.default.svc.cluster.local
  port: 9090

# Optional Gateway API HTTPRoute for Envoy Gateway same-port routing. Enable
# this when the chart should attach the GUI and gRPC-Web routes to an existing
# Gateway listener.
gateway:
  enabled: false
  createGatewayClass: false
  createGateway: false
  className: eg
  hostnames: []
  parentRefs: []
  listener:
    name: http
    protocol: HTTP
    port: 80

app:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000

envoy:
  image:
    repository: envoyproxy/envoy
    # Envoy does not publish a plain `latest` tag, so pin a verified image tag.
    tag: v1.36.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  cors:
    # These are the browser origins allowed to call Envoy. The localhost
    # defaults support kubectl port-forward during review.
    allowedOriginPrefixes:
      - http://localhost
      - http://127.0.0.1
  admin:
    enabled: false
    port: 9901

resources: {}
