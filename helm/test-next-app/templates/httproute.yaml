{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "test-next-app.fullname" . }}
  labels:
    {{- include "test-next-app.labels" . | nindent 4 }}
spec:
{{- with .Values.gateway.hostnames }}
  hostnames:
{{- range . }}
    - {{ . | quote }}
{{- end }}
{{- end }}
  parentRefs:
{{- if .Values.gateway.parentRefs }}
{{- range .Values.gateway.parentRefs }}
    - name: {{ required "gateway.parentRefs[].name is required when gateway.enabled=true" .name | quote }}
{{- with .namespace }}
      namespace: {{ . | quote }}
{{- end }}
{{- with .sectionName }}
      sectionName: {{ . | quote }}
{{- end }}
{{- end }}
{{- else if .Values.gateway.createGateway }}
    - name: {{ include "test-next-app.fullname" . | quote }}
{{- else }}
    - name: {{ required "gateway.parentRefs[0].name is required unless gateway.createGateway=true" "" | quote }}
{{- end }}
  rules:
    # gRPC-Web requests use the generated service path. This rule must stay
    # more specific than the general GUI route below.
    - matches:
        - path:
            type: PathPrefix
            value: /controlpanel.v1.SignalStimService/
      backendRefs:
        - name: {{ include "test-next-app.fullname" . }}-envoy
          port: {{ .Values.envoy.service.port }}
    # Everything else is the Next.js GUI: the page, static assets, and app
    # router paths.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "test-next-app.fullname" . }}-app
          port: {{ .Values.app.service.port }}
{{- end }}
