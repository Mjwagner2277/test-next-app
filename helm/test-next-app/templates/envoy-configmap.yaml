apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "test-next-app.fullname" . }}-envoy
  labels:
    {{- include "test-next-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: connect_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    codec_type: auto
                    stat_prefix: connect_proxy
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: connect_service
                          domains:
                            - '*'
                          cors:
                            allow_origin_string_match:
{{ range .Values.envoy.cors.allowedOriginPrefixes }}
                              - prefix: {{ . | quote }}
{{ end }}
                            allow_methods: GET, PUT, DELETE, POST, OPTIONS
                            allow_headers: keep-alive,user-agent,cache-control,content-type,content-encoding,connect-protocol-version,connect-timeout-ms,connect-content-encoding,connect-accept-encoding,authorization
                            expose_headers: connect-protocol-version
                            max_age: '1728000'
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: connect_server
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.cors
                        typed_config:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.router
                        typed_config:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: connect_server
          connect_timeout: 0.25s
          type: logical_dns
          http2_protocol_options: {}
          load_assignment:
            cluster_name: connect_server
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.upstreamConnect.host | quote }}
                          port_value: {{ .Values.upstreamConnect.port }}
{{ if .Values.envoy.admin.enabled }}
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .Values.envoy.admin.port }}
{{ end }}
