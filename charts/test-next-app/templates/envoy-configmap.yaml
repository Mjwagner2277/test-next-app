apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "test-next-app.fullname" . }}-envoy
  labels:
    {{- include "test-next-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: grpc_web_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    codec_type: auto
                    stat_prefix: grpc_web_proxy
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: grpc_service
                          domains:
                            - '*'
                          cors:
                            allow_origin_string_match:
{{ range .Values.envoy.cors.allowedOriginPrefixes }}
                              - prefix: {{ . | quote }}
{{ end }}
                            allow_methods: GET, PUT, DELETE, POST, OPTIONS
                            allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-grpc-web,grpc-timeout,authorization
                            expose_headers: grpc-status,grpc-message,grpc-status-details-bin
                            max_age: '1728000'
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: native_grpc_server
                                timeout: 0s
                                max_stream_duration:
                                  grpc_timeout_header_max: 0s
                    http_filters:
                      - name: envoy.filters.http.grpc_web
                        typed_config:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                      - name: envoy.filters.http.cors
                        typed_config:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.router
                        typed_config:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: native_grpc_server
          connect_timeout: 0.25s
          type: logical_dns
          http2_protocol_options: {}
          load_assignment:
            cluster_name: native_grpc_server
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.upstreamGrpc.host | quote }}
                          port_value: {{ .Values.upstreamGrpc.port }}
{{ if .Values.envoy.admin.enabled }}
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .Values.envoy.admin.port }}
{{ end }}
