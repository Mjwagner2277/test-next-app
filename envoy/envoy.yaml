static_resources:
  listeners:
    # Browser clients call this listener with gRPC-Web over HTTP/1.1 or HTTP/2.
    - name: grpc_web_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            # The HTTP connection manager owns routing and HTTP filters for this
            # listener. Envoy receives one HTTP request per RPC here.
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: auto
                stat_prefix: grpc_web_proxy
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: grpc_service
                      domains:
                        - '*'
                      # CORS is required because the Next.js app runs on port
                      # 3000 and Envoy runs on port 8080 during development.
                      cors:
                        allow_origin_string_match:
                          - exact: http://localhost:3000
                          - exact: http://127.0.0.1:3000
                        allow_methods: GET, PUT, DELETE, POST, OPTIONS
                        allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-grpc-web,grpc-timeout,authorization
                        expose_headers: grpc-status,grpc-message,grpc-status-details-bin
                        max_age: '1728000'
                      routes:
                        # Route every RPC path to the native gRPC upstream.
                        # gRPC method paths look like:
                        # /controlpanel.v1.ControlPanelService/GetStatus
                        - match:
                            prefix: /
                          route:
                            cluster: native_grpc_server
                            # Long-running or streaming RPCs should not be cut
                            # short by Envoy's default HTTP timeout.
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s
                http_filters:
                  # Converts browser gRPC-Web requests into native gRPC frames.
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb

                  # Handles browser preflight requests and response headers.
                  - name: envoy.filters.http.cors
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # The router filter must be last; it sends the request to the
                  # selected cluster.
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # This is the native server-hosted gRPC service. It should speak gRPC over
    # HTTP/2. The Helm chart templates this same idea from values.yaml.
    - name: native_grpc_server
      connect_timeout: 0.25s
      type: logical_dns

      # Critical for native gRPC upstreams: gRPC uses HTTP/2.
      http2_protocol_options: {}
      load_assignment:
        cluster_name: native_grpc_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: control-panel-grpc.default.svc.cluster.local
                      port_value: 9090

admin:
  # Local admin endpoint. Do not expose this publicly in production.
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
