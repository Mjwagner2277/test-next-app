static_resources:
  listeners:
    # Browser clients call this listener with the Connect protocol over HTTP.
    - name: connect_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            # The HTTP connection manager owns routing and HTTP filters for this
            # listener. Envoy receives one HTTP request per RPC here.
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: auto
                stat_prefix: connect_proxy
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: connect_service
                      domains:
                        - '*'
                      # CORS is required because the Next.js app runs on port
                      # 3000 and Envoy runs on port 8080 during development.
                      cors:
                        allow_origin_string_match:
                          - exact: http://localhost:3000
                          - exact: http://127.0.0.1:3000
                        allow_methods: GET, PUT, DELETE, POST, OPTIONS
                        allow_headers: keep-alive,user-agent,cache-control,content-type,content-encoding,connect-protocol-version,connect-timeout-ms,connect-content-encoding,connect-accept-encoding,authorization
                        expose_headers: connect-protocol-version
                        max_age: '1728000'
                      routes:
                        # Route every RPC path to the Connect protocol upstream.
                        # Connect method paths look like:
                        # /controlpanel.v1.ControlPanelService/GetStatus
                        - match:
                            prefix: /
                          route:
                            cluster: connect_server
                            # Long-running or streaming RPCs should not be cut
                            # short by Envoy's default HTTP timeout.
                            timeout: 0s
                http_filters:
                  # Handles browser preflight requests and response headers.
                  - name: envoy.filters.http.cors
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # The router filter must be last; it sends the request to the
                  # selected cluster.
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # This is the server-hosted Connect protocol service. Envoy is proxying HTTP
    # requests, not translating browser traffic into native gRPC frames.
    - name: connect_server
      connect_timeout: 0.25s
      type: logical_dns

      # Connect supports HTTP/1.1 and HTTP/2. Keep HTTP/2 enabled if your
      # upstream Connect server supports it; remove this for HTTP/1.1-only
      # upstreams.
      http2_protocol_options: {}
      load_assignment:
        cluster_name: connect_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: control-panel-connect.default.svc.cluster.local
                      port_value: 9090

admin:
  # Local admin endpoint. Do not expose this publicly in production.
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
